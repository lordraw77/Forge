apiVersion: v1
kind: Pod
metadata:
  name: {{ include "forge.fullname" . }}-test
  labels: {{ include "forge.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- include "forge.pullSecrets" . | nindent 2 }}
  {{- include "forge.podSecurity" (dict "root" . "uid" 10001) | nindent 2 }}
  containers:
    - name: readyz
      image: {{ include "forge.image" (dict "root" . "image" .Values.images.backend) }}
      imagePullPolicy: {{ .Values.images.pullPolicy }}
      command: ["python", "-c"]
      args:
        - |
          import json, urllib.request
          r = urllib.request.urlopen("http://{{ include "forge.fullname" . }}-web:8080/api/v1/version", timeout=10)
          print("web -> api", json.load(r))
          r = urllib.request.urlopen("http://{{ include "forge.fullname" . }}-api:8000/readyz", timeout=10)
          print("api ready", r.status, r.read().decode())
      {{- include "forge.containerSecurity" . | nindent 6 }}
