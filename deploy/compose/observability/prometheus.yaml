# Prometheus for the `observability` profile (ADR-009).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector  # metrics received over OTLP, re-exposed by the collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
