{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "forge.fullname" . }}
  labels: {{ include "forge.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [api, worker-runs, worker-ingest] }
  podMetricsEndpoints:
    - { port: metrics, interval: {{ .Values.metrics.serviceMonitor.interval }} }
{{- end }}
