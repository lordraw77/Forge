<main class="page">
  <nz-card class="card">
    <div class="brand">
      <img src="brand/forge-logo-light.svg" alt="Forge" width="168" height="56" />
    </div>

    @if (error(); as message) {
      <nz-alert nzType="error" [nzMessage]="message" nzShowIcon data-testid="login-error" />
    }

    @if (!challenge()) {
      <form (ngSubmit)="submit()" class="form">
        <label for="login" i18n>Username or email</label>
        <input
          nz-input
          id="login"
          name="login"
          autocomplete="username"
          required
          [(ngModel)]="loginName"
        />
        <label for="password" i18n>Password</label>
        <forge-password inputId="password" autocomplete="current-password" [(value)]="password" />
        <button nz-button nzType="primary" nzBlock type="submit" [nzLoading]="busy()" i18n>
          Sign in
        </button>
      </form>
    } @else {
      <form (ngSubmit)="submitCode()" class="form">
        @if (useRecovery) {
          <label for="code" i18n>Recovery code</label>
          <input nz-input id="code" name="code" autocomplete="off" [(ngModel)]="code" />
        } @else {
          <label for="code" i18n>Authentication code</label>
          <input
            nz-input
            id="code"
            name="code"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            [(ngModel)]="code"
          />
        }
        <button nz-button nzType="primary" nzBlock type="submit" [nzLoading]="busy()" i18n>
          Verify
        </button>
        <div class="links">
          <button type="button" class="link" (click)="useRecovery = !useRecovery; code = ''">
            @if (useRecovery) {
              <span i18n>Use an authentication code</span>
            } @else {
              <span i18n>Use a recovery code</span>
            }
          </button>
          <button type="button" class="link" (click)="restart()" i18n>Back</button>
        </div>
      </form>
    }
  </nz-card>
</main>
