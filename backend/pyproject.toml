[project]
name = "forge"
version = "0.1.0"
description = "Forge: self-hosted, LLM-agnostic platform for agents, RAG and governed prompts"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "structlog>=26.1",
    "redis>=6",
    "temporalio>=1.34",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.3",
    "argon2-cffi>=25.1.0",
    "pyotp>=2.10.0",
    "cryptography>=50.0.2",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
    "litellm==1.105.1",
    "jinja2>=3.1.6",
    "pgvector>=0.4",
    "boto3>=1.40",
    "python-multipart>=0.0.20",
    "prometheus-client>=0.22",
    "opentelemetry-sdk>=1.40",
    "opentelemetry-exporter-otlp-proto-http>=1.40",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-redis>=0.66b1",
    "ldap3>=2.9.1",
    "authlib>=1.9.1",
    "joserfc>=1.7.7",
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
    "jsonschema>=4.26.0",
    "httpx2>=2.13.1",
]

[project.optional-dependencies]
# Document parsing for the ingestion worker only (image forge-backend-ingest, ADR-013):
# Docling with CPU-only PyTorch. The API image and the dev environment do not install it.
ingest = ["docling>=2.140", "torch>=2.2", "torchvision>=0.17"]

[project.scripts]
forge = "forge.cli:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "ingest" }]
torchvision = [{ index = "pytorch-cpu", extra = "ingest" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
    "import-linter>=2.15",
    "pip-audit>=2.9",
    "openai>=2",
    "types-ldap3>=2.9.13.20260827",
    "types-pyyaml>=6.0.12.20260906",
    "types-jsonschema>=4.26.0.20261006",
]
spikes = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101"]  # assert is fine in tests; production code is checked by mypy/tests

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["S608", "E501"]  # SQL DDL reads better unwrapped
"src/forge/guardrails/injection/generate.py" = ["E501", "RUF001"]  # dataset text, one line each
"src/forge/guardrails/injection/detectors.py" = ["E501", "RUF001"]  # long regular expressions
"tests/**" = ["S105", "S106", "S608"]
"tests/integration/test_identity.py" = ["F811", "F401"]
"tests/integration/test_tools.py" = ["F811", "F401", "E501"]  # fixtures imported from test_platform_core
"spikes/**" = ["S608", "E501", "S603", "S311", "ASYNC230"]  # throwaway spike code, constant schema names

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["forge"]

[[tool.mypy.overrides]]
module = [
    "temporalio.*",
    "asyncpg.*",
    "boto3.*",
    "botocore.*",
    "docling.*",
    "docling_core.*",
    "pgvector.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs PostgreSQL (FORGE_TEST_DATABASE_URL)",
    "ac(id): links a test to a user story acceptance criterion, e.g. ac('US-1.1.1/1')",
]
addopts = "-ra --strict-markers"

# ADR-001: modules talk only through their public `service` interface.
[tool.importlinter]
root_package = "forge"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain modules are independent except through their service interface"
type = "independence"
modules = [
    "forge.iam",
    "forge.tenancy",
    "forge.admin",
    "forge.gateway",
    "forge.prompts",
    "forge.rag",
    "forge.bundles",
    "forge.tools",
    "forge.agents",
    "forge.usecases",
    "forge.guardrails",
    "forge.observability",
]
ignore_imports = [
    "forge.** -> forge.*.service",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "core depends on no domain module"
type = "forbidden"
source_modules = ["forge.core"]
forbidden_modules = [
    "forge.api",
    "forge.workers",
    "forge.iam",
    "forge.tenancy",
    "forge.admin",
    "forge.gateway",
    "forge.prompts",
    "forge.rag",
    "forge.bundles",
    "forge.tools",
    "forge.agents",
    "forge.usecases",
    "forge.guardrails",
    "forge.observability",
]

# ADR-005: only the gateway talks to model providers.
[[tool.importlinter.contracts]]
name = "Only the gateway imports LiteLLM"
type = "forbidden"
source_modules = [
    "forge.core",
    "forge.api",
    "forge.workers",
    "forge.iam",
    "forge.tenancy",
    "forge.admin",
    "forge.prompts",
    "forge.rag",
    "forge.bundles",
    "forge.tools",
    "forge.agents",
    "forge.usecases",
    "forge.guardrails",
    "forge.observability",
]
forbidden_modules = ["litellm"]
allow_indirect_imports = true
