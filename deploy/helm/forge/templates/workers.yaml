{{- $fn := include "forge.fullname" . }}
{{- range $w := list (dict "key" "runs" "values" .Values.workerRuns "image" .Values.images.backend) (dict "key" "ingest" "values" .Values.workerIngest "image" .Values.images.ingest) }}
{{- with $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-worker-{{ $w.key }}
  labels: {{ include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-{{ $w.key }}
spec:
  replicas: {{ $w.values.replicas }}
  selector:
    matchLabels: {{ include "forge.selector" (dict "root" . "component" (print "worker-" $w.key)) | nindent 6 }}
  template:
    metadata:
      labels: {{ include "forge.selector" (dict "root" . "component" (print "worker-" $w.key)) | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | trunc 16 }}
    spec:
      {{- include "forge.pullSecrets" . | nindent 6 }}
      {{- include "forge.podSecurity" (dict "root" . "uid" 10001) | nindent 6 }}
      {{- include "forge.scheduling" $w.values | nindent 6 }}
      initContainers:
        # The api runs the migrations before it is ready: workers wait for it.
        - name: wait-for-api
          image: {{ include "forge.image" (dict "root" . "image" .Values.images.backend) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["python", "-c"]
          args:
            - |
              import time, urllib.request
              url = "http://{{ $fn }}-api:8000/readyz"
              for _ in range(360):
                  try:
                      if urllib.request.urlopen(url, timeout=3).status == 200:
                          raise SystemExit(0)
                  except Exception:
                      time.sleep(5)
              raise SystemExit("api not ready after 30 minutes")
          {{- include "forge.containerSecurity" . | nindent 10 }}
      containers:
        - name: worker
          image: {{ include "forge.image" (dict "root" . "image" $w.image) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["worker", {{ $w.key | quote }}]
          env: {{ include "forge.env" . | nindent 12 }}
          ports:
            - { name: metrics, containerPort: 9100 }
          livenessProbe:
            exec: { command: ["forge", "worker-health"] }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {{ toYaml $w.values.resources | nindent 12 }}
          volumeMounts: {{ include "forge.volumeMounts" . | nindent 12 }}
            {{- if and (eq $w.key "ingest") .Values.workerIngest.modelsVolume.enabled }}
            - { name: models, mountPath: /app/models }
            {{- end }}
          {{- include "forge.containerSecurity" . | nindent 10 }}
      volumes: {{ include "forge.volumes" . | nindent 8 }}
        {{- if and (eq $w.key "ingest") .Values.workerIngest.modelsVolume.enabled }}
        - name: models
          persistentVolumeClaim: { claimName: {{ $fn }}-models }
        {{- end }}
{{- end }}
{{- end }}
{{- if .Values.workerIngest.modelsVolume.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fn }}-models
  labels: {{ include "forge.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.global.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.workerIngest.modelsVolume.size }} } }
{{- end }}
