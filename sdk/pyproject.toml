[project]
name = "forge-sdk"
version = "0.1.0"
description = "Python SDK and command line (forgectl) for Forge: bundles as files in Git, use case runs, the OpenAI-compatible gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
forgectl = "forge_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
