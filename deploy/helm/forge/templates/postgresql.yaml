{{- if .Values.postgresql.enabled }}
{{- $fn := include "forge.fullname" . }}
{{- $secret := include "forge.secretName" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-postgresql-init
  labels: {{ include "forge.labels" . | nindent 4 }}
data:
  10-forge.sh: |
{{ .Files.Get "files/init-databases.sh" | indent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-postgresql
  labels: {{ include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ $fn }}-postgresql
  replicas: 1
  selector:
    matchLabels: {{ include "forge.selector" (dict "root" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels: {{ include "forge.selector" (dict "root" . "component" "postgresql") | nindent 8 }}
    spec:
      {{- include "forge.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        {{- if not .Values.openshift }}
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      {{- if .Values.postgresql.pitr.enabled }}
      initContainers:
        - name: backup-bucket
          image: {{ include "forge.image" (dict "root" . "image" .Values.images.backend) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["storage", "ensure-bucket", {{ .Values.postgresql.pitr.s3.bucket | quote }}]
          env:
            - { name: FORGE_DATABASE_URL, value: "postgresql+asyncpg://unused@localhost/unused" }
            - name: FORGE_MASTER_KEY
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: master-key } }
            - { name: FORGE_S3_ENDPOINT, value: {{ default (include "forge.s3.endpoint" .) .Values.postgresql.pitr.s3.endpoint | quote }} }
            - name: FORGE_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: {{ ternary "pitr-s3-access-key" "s3-access-key" (ne .Values.postgresql.pitr.s3.accessKey "") }} } }
            - name: FORGE_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: {{ ternary "pitr-s3-secret-key" "s3-secret-key" (ne .Values.postgresql.pitr.s3.accessKey "") }} } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          {{- include "forge.containerSecurity" . | nindent 10 }}
      {{- end }}
      containers:
        - name: postgresql
          image: {{ if .Values.postgresql.pitr.enabled }}{{ include "forge.image" (dict "root" . "image" .Values.postgresql.pitr.image) }}{{ else }}{{ include "forge.thirdPartyImage" (dict "root" . "image" .Values.postgresql.image) }}{{ end }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - -c
            - max_connections={{ .Values.postgresql.maxConnections }}
          {{- if .Values.postgresql.pitr.enabled }}
            - -c
            - wal_level=replica
            - -c
            - archive_mode=on
            - -c
            - archive_command=wal-g wal-push %p
            - -c
            - archive_timeout=60
          {{- end }}
          env:
            {{- if .Values.postgresql.pitr.enabled }}
            {{- include "forge.pitr.env" . | nindent 12 }}
            - { name: PGHOST, value: /var/run/postgresql }
            - { name: PGUSER, value: postgres }
            {{- end }}
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_DB, value: postgres }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: FORGE_DB_NAME, value: forge }
            - { name: FORGE_DB_USER, value: forge }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: postgres-password } }
            - name: FORGE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: db-password } }
            - name: TEMPORAL_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: temporal-db-password } }
          ports:
            - { name: postgresql, containerPort: 5432 }
          readinessProbe:
            # TCP: the init server listens on the socket only, so this waits for the init scripts.
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "forge"] }
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"] }
            periodSeconds: 20
            initialDelaySeconds: 30
          resources: {{ toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            # Parallel index builds (HNSW) allocate shared memory; the default 64 MB fails them.
            - { name: shm, mountPath: /dev/shm }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
        {{- if .Values.postgresql.pitr.enabled }}
        - name: backup
          image: {{ include "forge.image" (dict "root" . "image" .Values.postgresql.pitr.image) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["pitr-backup-loop.sh"]
          env:
            {{- include "forge.pitr.env" . | nindent 12 }}
            - { name: PGHOST, value: 127.0.0.1 }
            - { name: PGUSER, value: postgres }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: postgres-password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: BACKUP_INTERVAL_HOURS, value: {{ .Values.postgresql.pitr.intervalHours | quote }} }
            - { name: BACKUP_RETAIN_FULL, value: {{ .Values.postgresql.pitr.retainFull | quote }} }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
        {{- end }}
      volumes:
        - name: init
          configMap: { name: {{ $fn }}-postgresql-init, defaultMode: 0555 }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: {{ .Values.postgresql.shmSize }} }
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.global.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgresql.persistence.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-postgresql
  labels: {{ include "forge.labels" . | nindent 4 }}
spec:
  selector: {{ include "forge.selector" (dict "root" . "component" "postgresql") | nindent 4 }}
  ports:
    - { name: postgresql, port: 5432, targetPort: postgresql }
{{- end }}
