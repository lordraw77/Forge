{{- if .Values.seaweedfs.enabled }}
{{- $fn := include "forge.fullname" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-seaweedfs
  labels: {{ include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
spec:
  serviceName: {{ $fn }}-seaweedfs
  replicas: 1
  selector:
    matchLabels: {{ include "forge.selector" (dict "root" . "component" "seaweedfs") | nindent 6 }}
  template:
    metadata:
      labels: {{ include "forge.selector" (dict "root" . "component" "seaweedfs") | nindent 8 }}
    spec:
      {{- include "forge.pullSecrets" . | nindent 6 }}
      {{- include "forge.podSecurity" (dict "root" . "uid" 1000) | nindent 6 }}
      containers:
        - name: seaweedfs
          image: {{ include "forge.thirdPartyImage" (dict "root" . "image" .Values.seaweedfs.image) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            # The identity file is written to the tmp volume from the environment (ADR-015), so no
            # secret is mounted as a file. Small volumes and an explicit maximum: every bucket is a
            # collection that grows several volumes at once.
            - |
              umask 077
              printf '{"identities":[{"name":"forge","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
                "$S3_ACCESS_KEY" "$S3_SECRET_KEY" > /tmp/s3.json
              exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json \
                -master.volumeSizeLimitMB=512 -volume.max=200
          env:
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "forge.secretName" . }}, key: s3-access-key } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "forge.secretName" . }}, key: s3-secret-key } }
          ports:
            - { name: s3, containerPort: 8333 }
          readinessProbe:
            httpGet: { path: /healthz, port: s3 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: s3 }
            periodSeconds: 20
            initialDelaySeconds: 20
          resources: {{ toYaml .Values.seaweedfs.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          {{- include "forge.containerSecurity" . | nindent 10 }}
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.global.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.seaweedfs.persistence.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-seaweedfs
  labels: {{ include "forge.labels" . | nindent 4 }}
spec:
  selector: {{ include "forge.selector" (dict "root" . "component" "seaweedfs") | nindent 4 }}
  ports:
    - { name: s3, port: 8333, targetPort: s3 }
{{- end }}
