# Forge – single node / lab deployment.
# Run through the Makefile (`make docker/run`), which passes:
#   --project-directory . --env-file .env --env-file deploy/compose/infra.env
# Secrets come from those two files (scripts/gen-env.sh); nothing secret is hardcoded here.

name: forge

x-backend: &backend
  image: ${FORGE_BACKEND_IMAGE:-forge-backend:dev}
  build:
    context: ./backend
  restart: unless-stopped
  env_file: [.env]
  environment:
    FORGE_REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
    FORGE_S3_ENDPOINT: http://s3:8333
    FORGE_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    FORGE_S3_SECRET_KEY: ${S3_SECRET_KEY}
    FORGE_TEMPORAL_ADDRESS: temporal:7233
    FORGE_SEARCH_URL: https://search:9200
    FORGE_SEARCH_USERNAME: forge
    FORGE_SEARCH_PASSWORD: ${FORGE_SEARCH_PASSWORD}
    FORGE_SEARCH_CA_FILE: /etc/forge/search-ca.pem
    # Spans go to the collector of the `observability` profile when this is set (ADR-009);
    # /metrics of every process listens on the internal port FORGE_METRICS_PORT (9100).
    FORGE_OTLP_ENDPOINT: ${FORGE_OTLP_ENDPOINT:-}
    # Agent http_get may reach private addresses only when this is true (labs).
    FORGE_AGENT_ALLOW_PRIVATE_HOSTS: ${FORGE_AGENT_ALLOW_PRIVATE_HOSTS:-false}
    FORGE_TOOLS_ALLOW_PRIVATE_HOSTS: ${FORGE_TOOLS_ALLOW_PRIVATE_HOSTS:-false}
    FORGE_MCP_STDIO_ALLOWED: ${FORGE_MCP_STDIO_ALLOWED:-}
    FORGE_SOURCE_ROOTS: ${FORGE_SOURCE_ROOTS:-}
    # Sandbox runner (profile `sandbox`): Python tools and `code` nodes. Empty = unavailable.
    FORGE_SANDBOX_URL: ${FORGE_SANDBOX_URL:-}
    FORGE_SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
    # Email for approval notifications (optional; no host = no email).
    FORGE_SMTP_HOST: ${FORGE_SMTP_HOST:-}
    FORGE_SMTP_PORT: ${FORGE_SMTP_PORT:-587}
    FORGE_SMTP_USERNAME: ${FORGE_SMTP_USERNAME:-}
    FORGE_SMTP_PASSWORD: ${FORGE_SMTP_PASSWORD:-}
    FORGE_SMTP_FROM: ${FORGE_SMTP_FROM:-forge@localhost}
    FORGE_SMTP_STARTTLS: ${FORGE_SMTP_STARTTLS:-true}
    # Corporate egress proxy (optional). Forge's own services never go through it.
    HTTP_PROXY: ${FORGE_HTTP_PROXY:-}
    HTTPS_PROXY: ${FORGE_HTTPS_PROXY:-}
    NO_PROXY: ${FORGE_NO_PROXY:-}${FORGE_NO_PROXY:+,}db,valkey,s3,search,temporal,api,web,otel-collector,localhost,127.0.0.1
    # Extra trusted root CA (optional), e.g. for a TLS-inspecting proxy: put the PEM file in
    # deploy/compose/extra-ca/ and set FORGE_EXTRA_CA_FILE=/etc/forge/extra-ca/<file>.pem
    FORGE_EXTRA_CA_FILE: ${FORGE_EXTRA_CA_FILE:-}
  volumes:
    - ./deploy/compose/search/certs/root-ca.pem:/etc/forge/search-ca.pem:ro
    - ./deploy/compose/extra-ca:/etc/forge/extra-ca:ro
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  db:
    # PostgreSQL 17 + pgvector (ADR-008); BM25 full-text runs in `search` (ADR-016).
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    # Parallel index builds (HNSW, BM25) allocate maintenance_work_mem in /dev/shm;
    # Docker's 64 MB default fails them (spike E0.5b).
    shm_size: 2gb
    # Forge's processes keep up to ~30 connections each (SQLAlchemy pool + overflow + the agent
    # checkpoint pool) and Temporal ~30: PostgreSQL's default of 100 runs out under load (E3.7).
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      FORGE_DB_NAME: ${FORGE_DB_NAME}
      FORGE_DB_USER: ${FORGE_DB_USER}
      FORGE_DB_PASSWORD: ${FORGE_DB_PASSWORD}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/compose/initdb/10-forge.sh:/docker-entrypoint-initdb.d/10-forge.sh:ro
    ports: ["127.0.0.1:${FORGE_DB_PORT:-5432}:5432"]
    healthcheck:
      # TCP, not the socket: the init server only listens on the socket, so this stays
      # unhealthy until initdb scripts (roles, databases) have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ${FORGE_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.0.6-alpine3.24
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD}", "--save", "60", "1000"]
    volumes: [valkey-data:/data]
    ports: ["127.0.0.1:${FORGE_VALKEY_PORT:-6379}:6379"]  # host-side tests and tools
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  # Sandbox for Python tools and `code` nodes (E3.4), profile `sandbox`: `make sandbox/up`.
  # It is the only service that holds the container engine socket (that socket is root on the
  # host: nothing else gets it). Each execution is a throw-away container of the runtime image.
  sandbox:
    image: ${FORGE_SANDBOX_IMAGE:-forge-sandbox:dev}
    profiles: [sandbox]
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN}
      SANDBOX_RUNTIME_IMAGE: ${FORGE_SANDBOX_RUNTIME_IMAGE:-forge-sandbox-runtime:dev}
      # "runsc" runs every execution under gVisor (needs runsc registered with the engine).
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      SANDBOX_MAX_CONCURRENCY: ${SANDBOX_MAX_CONCURRENCY:-4}
      # Executions that are given hosts to reach join this internal network and go out through
      # the proxy this service runs (port 8091); without it they have no network at all.
      SANDBOX_NETWORK: forge-sandbox-egress
      SANDBOX_PROXY_HOST: sandbox
    networks:
      default: {}
      sandbox-egress:
        aliases: [sandbox]
    group_add: ["${SANDBOX_DOCKER_GID:-0}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Builds the image the sandbox runs code in; it exits at once.
  sandbox-runtime:
    image: ${FORGE_SANDBOX_RUNTIME_IMAGE:-forge-sandbox-runtime:dev}
    profiles: [sandbox]
    build:
      context: ./sandbox
      dockerfile: Dockerfile.runtime
    restart: "no"
    command: ["true"]

  # BM25 full-text search for RAG (ADR-016). Security plugin on: TLS and users from
  # scripts/gen-env.sh; Forge connects as `forge` (role forge_app, indices forge-* only).
  search:
    image: opensearchproject/opensearch:3.9.0
    restart: unless-stopped
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms${FORGE_SEARCH_HEAP:-1g} -Xmx${FORGE_SEARCH_HEAP:-1g}
      FORGE_SEARCH_PASSWORD: ${FORGE_SEARCH_PASSWORD}  # healthcheck only
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - search-data:/usr/share/opensearch/data
      - ./deploy/compose/search/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./deploy/compose/search/certs:/usr/share/opensearch/config/certs:ro
      - ./deploy/compose/search/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml:ro
      - ./deploy/compose/search/roles.yml:/usr/share/opensearch/config/opensearch-security/roles.yml:ro
      - ./deploy/compose/search/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml:ro
    ports: ["127.0.0.1:${FORGE_SEARCH_PORT:-9200}:9200"]  # host-side tests, spikes
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert config/certs/root-ca.pem -u \"forge:$$FORGE_SEARCH_PASSWORD\" 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 40s

  # S3-compatible object storage. MinIO no longer publishes container images;
  # any S3 endpoint works (backend uses the S3 API only).
  s3:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    # Identity file is written to tmpfs from the environment, so no secret file is mounted.
    # Each bucket is a SeaweedFS collection that grows several volumes at once: small volumes
    # and an explicit maximum, or a single node runs out of volume slots (ADR-015).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        printf '{"identities":[{"name":"forge","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json \
          -master.volumeSizeLimitMB=512 -volume.max=200
    tmpfs: [/tmp]
    volumes: [s3-data:/data]
    ports: ["127.0.0.1:${FORGE_S3_PORT:-8333}:8333"]  # host-side tests and tools
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.7
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: db
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD}
      SKIP_DB_CREATE: "true"  # databases are created by deploy/compose/initdb
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["127.0.0.1:${FORGE_TEMPORAL_PORT:-7233}:7233"]  # host-side tools, spikes, tests
    healthcheck:
      test: ["CMD-SHELL", "temporal operator namespace describe -n default --address temporal:7233 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    <<: *backend
    command: ["migrate"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    command: ["api"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      search: { condition: service_healthy }

  worker-runs:
    <<: *backend
    command: ["worker", "runs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }
      valkey: { condition: service_healthy }
      search: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "forge", "worker-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  worker-ingest:
    <<: *backend
    # Ingestion variant: Docling with CPU PyTorch and baked-in models (ADR-013).
    image: ${FORGE_INGEST_IMAGE:-forge-backend-ingest:dev}
    build:
      context: ./backend
      args: { EXTRAS: ingest }
    command: ["worker", "ingest"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "forge", "worker-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  web:
    image: ${FORGE_WEB_IMAGE:-forge-web:dev}
    build:
      context: ./frontend
      additional_contexts:
        guide: ./docs/guide
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      # Reverse proxies or load balancers in front of this service (comma-separated CIDRs).
      # Only from these does it believe X-Forwarded-For/-Proto; default none.
      FORGE_TRUSTED_PROXIES: ${FORGE_TRUSTED_PROXIES:-}
    ports: ["${FORGE_HTTP_PORT:-8080}:8080"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Test directory for the external-identity integration tests: `make test/integration`.
  openldap:
    image: osixia/openldap:1.5.0
    profiles: [idp-test]
    command: --copy-service
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin-test-pass
      LDAP_TLS: "false"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -D cn=admin,dc=example,dc=org -w admin-test-pass -b uid=dave,ou=people,dc=example,dc=org dn | grep -q '^dn:'"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - ./deploy/compose/openldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif:ro
    ports:
      - "127.0.0.1:${FORGE_LDAP_TEST_PORT:-3890}:389"

  temporal-ui:
    image: temporalio/ui:2.54.1
    profiles: [tools]
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["127.0.0.1:8233:8080"]

  # ---- profile `observability` (ADR-009): `make obs/up`. Forge works without it.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    profiles: [observability]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/compose/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"  # OTLP gRPC
      - "127.0.0.1:4318:4318"  # OTLP HTTP
    depends_on:
      loki: { condition: service_started }

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/compose/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 20

  loki:
    image: grafana/loki:3.7.8
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/compose/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports: ["127.0.0.1:3100:3100"]  # distroless image: readiness is http://127.0.0.1:3100/ready

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/compose/observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/forge.yaml:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      prometheus: { condition: service_healthy }
      loki: { condition: service_started }

networks:
  # Only the sandbox runner is on it with the throw-away executions that may reach some hosts:
  # `internal` means no route to anywhere else, so the runner's proxy is the only way out.
  sandbox-egress:
    name: forge-sandbox-egress
    internal: true

volumes:
  db-data:
  valkey-data:
  s3-data:
  search-data:
  prometheus-data:
  loki-data:
  grafana-data:
