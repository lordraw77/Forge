<div class="layout" [class.menu-open]="menuOpen()">
  <aside class="sidebar" aria-label="Main navigation" i18n-aria-label>
    <a class="brand" routerLink="/" (click)="menuOpen.set(false)">
      <img src="brand/forge-logo-dark.svg" alt="Forge" width="120" height="40" />
    </a>

    <nav>
      <ul>
        @for (entry of menu; track entry.path) {
          <li>
            <a [routerLink]="entry.path" routerLinkActive="active" (click)="menuOpen.set(false)">
              <i [class]="entry.icon" aria-hidden="true"></i>
              <span>{{ entry.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="profile">
      <p-avatar [label]="initials()" shape="circle" />
      <div class="who">
        <strong data-testid="user-name">{{
          session.user()?.full_name || session.user()?.username
        }}</strong>
        <small>{{ roleLabel() }} · {{ session.user()?.email }}</small>
      </div>
      <p-button
        icon="pi pi-ellipsis-v"
        [text]="true"
        [rounded]="true"
        ariaLabel="Profile menu"
        i18n-ariaLabel
        data-testid="profile-menu"
        (onClick)="profile.toggle($event)"
      />
      <p-menu #profile [model]="profileItems()" [popup]="true" appendTo="body" />
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <p-button
        class="menu-toggle"
        icon="pi pi-bars"
        [text]="true"
        (onClick)="toggleMenu()"
        ariaLabel="Toggle menu"
        i18n-ariaLabel
      />
      <label class="project" for="project-select">
        <span i18n>Project</span>
        <p-select
          inputId="project-select"
          [options]="session.projects()"
          [ngModel]="session.project()?.id"
          (ngModelChange)="session.selectProject($event)"
          optionLabel="name"
          optionValue="id"
          [filter]="true"
          filterBy="name"
          placeholder="No project"
          i18n-placeholder
          data-testid="project-select"
        />
      </label>
      <span class="spacer"></span>
      @switch (system.version()) {
        @case (undefined) {
          <p-tag severity="secondary" value="…" />
        }
        @case (null) {
          <p-tag severity="danger" value="API offline" i18n-value />
        }
        @default {
          <p-tag severity="success" [value]="'API ' + system.version()" />
        }
      }
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
