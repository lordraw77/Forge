# Prometheus for the `observability` profile (ADR-009).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector  # metrics received over OTLP, re-exposed by the collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]
  # Forge's own /metrics (internal port 9100 of each process, US-1.20.2).
  - job_name: forge
    static_configs:
      - targets: ["api:9100"]
        labels: { process: api }
      - targets: ["worker-runs:9100"]
        labels: { process: worker-runs }
      - targets: ["worker-ingest:9100"]
        labels: { process: worker-ingest }
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
