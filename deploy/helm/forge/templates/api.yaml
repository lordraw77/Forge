{{- $fn := include "forge.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-api
  labels: {{ include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{ include "forge.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{ include "forge.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | trunc 16 }}
    spec:
      {{- include "forge.pullSecrets" . | nindent 6 }}
      {{- include "forge.podSecurity" (dict "root" . "uid" 10001) | nindent 6 }}
      {{- include "forge.scheduling" .Values.api | nindent 6 }}
      initContainers:
        # Database migrations; a lock inside the migration lets several api pods start at once.
        - name: migrate
          image: {{ include "forge.image" (dict "root" . "image" .Values.images.backend) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["migrate"]
          env: {{ include "forge.env" . | nindent 12 }}
          volumeMounts: {{ include "forge.volumeMounts" . | nindent 12 }}
          {{- include "forge.containerSecurity" . | nindent 10 }}
      containers:
        - name: api
          image: {{ include "forge.image" (dict "root" . "image" .Values.images.backend) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["api"]
          env: {{ include "forge.env" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8000 }
            - { name: metrics, containerPort: 9100 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 4
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          volumeMounts: {{ include "forge.volumeMounts" . | nindent 12 }}
          {{- include "forge.containerSecurity" . | nindent 10 }}
      volumes: {{ include "forge.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-api
  labels: {{ include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector: {{ include "forge.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http }
    - { name: metrics, port: 9100, targetPort: metrics }
