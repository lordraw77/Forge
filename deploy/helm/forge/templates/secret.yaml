{{- if not .Values.existingSecret }}
{{- $name := include "forge.fullname" . -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- /* A value given in values.yaml wins; else the one already stored; else a new random one (forge.pick). */ -}}
{{- $pg := include "forge.pick" (dict "given" (ternary "" .Values.external.postgresql.password .Values.postgresql.enabled) "old" $old "key" "db-password" "len" 32) -}}
{{- $valkey := include "forge.pick" (dict "given" (ternary "" .Values.external.valkey.password .Values.valkey.enabled) "old" $old "key" "valkey-password" "len" 32) -}}
{{- $search := include "forge.pick" (dict "given" (ternary "" .Values.external.opensearch.password .Values.opensearch.enabled) "old" $old "key" "search-password" "len" 32) -}}
{{- $s3a := include "forge.pick" (dict "given" (ternary "" .Values.external.s3.accessKey .Values.seaweedfs.enabled) "old" $old "key" "s3-access-key" "len" 20) -}}
{{- $s3s := include "forge.pick" (dict "given" (ternary "" .Values.external.s3.secretKey .Values.seaweedfs.enabled) "old" $old "key" "s3-secret-key" "len" 40) -}}
{{- $tdb := include "forge.pick" (dict "given" .Values.external.postgresql.temporalPassword "old" $old "key" "temporal-db-password" "len" 32) -}}
{{- $dbUrlPass := urlquery $pg | replace "+" "%20" -}}
{{- $sslmode := ternary (printf "?ssl=%s" .Values.external.postgresql.sslmode) "" (and (not .Values.postgresql.enabled) (ne .Values.external.postgresql.sslmode "")) -}}
{{- $dbUser := ternary "forge" .Values.external.postgresql.username .Values.postgresql.enabled -}}
{{- $dbName := ternary "forge" .Values.external.postgresql.database .Values.postgresql.enabled -}}
{{- $scheme := ternary "rediss" "redis" (and (not .Values.valkey.enabled) .Values.external.valkey.tls) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{ include "forge.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  master-key: {{ include "forge.pick" (dict "given" .Values.config.masterKey "old" $old "key" "master-key" "len" 48) | quote }}
  admin-password: {{ include "forge.pick" (dict "given" .Values.config.adminPassword "old" $old "key" "admin-password" "len" 24) | quote }}
  database-url: {{ printf "postgresql+asyncpg://%s:%s@%s:%s/%s%s" $dbUser $dbUrlPass (include "forge.pg.host" .) (include "forge.pg.port" . | toString) $dbName $sslmode | quote }}
  db-password: {{ $pg | quote }}
  postgres-password: {{ include "forge.pick" (dict "given" "" "old" $old "key" "postgres-password" "len" 32) | quote }}
  temporal-db-password: {{ $tdb | quote }}
  valkey-password: {{ $valkey | quote }}
  redis-url: {{ printf "%s://:%s@%s:%s/0" $scheme (urlquery $valkey | replace "+" "%20") (include "forge.valkey.host" .) (include "forge.valkey.port" . | toString) | quote }}
  s3-access-key: {{ $s3a | quote }}
  s3-secret-key: {{ $s3s | quote }}
  search-password: {{ $search | quote }}
  pitr-encryption-key: {{ if hasKey $old "pitr-encryption-key" }}{{ index $old "pitr-encryption-key" | b64dec | quote }}{{ else }}{{ sha256sum (randAlphaNum 64) | quote }}{{ end }}
  {{- if .Values.postgresql.pitr.s3.accessKey }}
  pitr-s3-access-key: {{ .Values.postgresql.pitr.s3.accessKey | quote }}
  pitr-s3-secret-key: {{ .Values.postgresql.pitr.s3.secretKey | quote }}
  {{- end }}
  search-admin-password: {{ include "forge.pick" (dict "given" "" "old" $old "key" "search-admin-password" "len" 32) | quote }}
  {{- if .Values.sandbox.url }}
  sandbox-token: {{ .Values.sandbox.token | quote }}
  {{- end }}
  {{- if .Values.smtp.passwordKey }}
  {{ .Values.smtp.passwordKey }}: {{ .Values.smtp.password | quote }}
  {{- end }}
{{- end }}
